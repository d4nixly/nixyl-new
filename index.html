<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NIXYL — Find Something Worth Playing</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #090909;
      color: #f5f2ed;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .hero {
      min-height: 100vh;
      position: relative;
      padding: 28px 7%;
      overflow: hidden;
      background:
        radial-gradient(circle at 75% 45%, rgba(180, 55, 25, 0.18), transparent 30%),
        radial-gradient(circle at 20% 80%, rgba(255, 80, 30, 0.06), transparent 25%),
        #090909;
    }

    /* NAV */

    nav {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 10;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .nav-links {
      display: flex;
      gap: 38px;
      align-items: center;
    }

    .nav-links a {
      color: #aaa;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.12em;
      transition: 0.25s;
    }

    .nav-links a:hover {
      color: white;
    }

    .search {
      width: 34px;
      height: 34px;
      border: 1px solid #333;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      font-size: 14px;
    }

    /* HERO */

    .hero-content {
      position: relative;
      z-index: 5;
      max-width: 620px;
      padding-top: 17vh;
    }

    .eyebrow {
      color: #e85a32;
      font-size: 11px;
      letter-spacing: 0.22em;
      margin-bottom: 22px;
      font-weight: 700;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(55px, 7vw, 100px);
      font-weight: 400;
      line-height: 0.94;
      letter-spacing: -0.055em;
      max-width: 700px;
    }

    .description {
      color: #9d9d9d;
      font-size: 16px;
      line-height: 1.7;
      max-width: 500px;
      margin-top: 30px;
    }

    .buttons {
      display: flex;
      gap: 14px;
      margin-top: 36px;
    }

    .button {
      text-decoration: none;
      padding: 15px 22px;
      font-size: 11px;
      letter-spacing: 0.12em;
      font-weight: 700;
      transition: 0.25s;
    }

    .primary {
      background: #f0ece5;
      color: #111;
    }

    .primary:hover {
      background: white;
      transform: translateY(-2px);
    }

    .secondary {
      border: 1px solid #393939;
      color: #ddd;
    }

    .secondary:hover {
      border-color: #777;
      transform: translateY(-2px);
    }

    /* RIGHT VISUAL */

    .visual {
      position: absolute;
      width: 620px;
      height: 620px;
      right: 2%;
      top: 17%;
      z-index: 2;
    }

    .glow {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(200, 65, 25, 0.16);
      filter: blur(80px);
      top: 90px;
      left: 100px;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.13);
    }

    .orb.one {
      width: 400px;
      height: 400px;
      top: 100px;
      left: 100px;
    }

    .orb.two {
      width: 290px;
      height: 290px;
      top: 155px;
      left: 155px;
    }

    .trophy {
      position: absolute;
      font-size: 150px;
      top: 190px;
      left: 220px;
      filter: drop-shadow(0 25px 30px rgba(0,0,0,0.7));
      transform: rotate(-8deg);
    }

    .coil {
      position: absolute;
      font-size: 90px;
      right: 65px;
      bottom: 100px;
      transform: rotate(15deg);
      filter: drop-shadow(0 20px 25px rgba(0,0,0,0.7));
    }

    .label {
      position: absolute;
      bottom: 55px;
      left: 0;
      color: #555;
      font-size: 10px;
      letter-spacing: 0.18em;
    }

    /* RESPONSIVE */

    @media (max-width: 900px) {
      .hero {
        padding: 24px;
      }

      .nav-links {
        gap: 15px;
      }

      .visual {
        opacity: 0.3;
        right: -220px;
      }

      .hero-content {
        padding-top: 18vh;
      }
    }

    @media (max-width: 600px) {
      .nav-links a:nth-child(3) {
        display: none;
      }

      h1 {
        font-size: 56px;
      }

      .description {
        font-size: 14px;
      }

      .buttons {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <section class="hero">

    <nav>
      <div class="logo">NIXYL</div>

      <div class="nav-links">
        <a href="#">PLAY</a>
        <a href="#">DEV HUB</a>
        <a href="#">DISCOVER</a>
        <div class="search">⌕</div>
      </div>
    </nav>

    <div class="hero-content">

      <div class="eyebrow">ROBLOX DISCOVERY</div>

      <h1>Find something worth playing.</h1>

      <p class="description">
        Stop scrolling through endless Roblox experiences.
        Tell NIXYL what you have time for, who you're playing with,
        and what kind of experience you want.
      </p>

      <div class="buttons">
        <a href="#" class="button primary">EXPLORE NIXYL PLAY</a>
        <a href="#" class="button secondary">EXPLORE DEV HUB</a>
      </div>

    </div>

    <div class="visual">
      <div class="glow"></div>
      <div class="orb one"></div>
      <div class="orb two"></div>

      <div class="trophy">🏆</div>
      <div class="coil">🌀</div>

      <div class="label">DISCOVER · PLAY · BUILD</div>
    </div>

  </section>

</body>
</html>
